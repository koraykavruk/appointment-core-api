<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Randevu & Hasta Kayıt Servisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-10 font-sans">
    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Header -->
        <header class="border-b border-white/10 pb-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="text-2xl">🚀</span>
                    <h1 class="text-xl md:text-2xl font-bold text-white tracking-wide">Online Randevu & Hasta Kayıt Servisi</h1>
                </div>
                <p class="text-xs text-slate-400 mt-1">Geliştirici: <strong>DevHive AI</strong> | Mimari: <strong>Python (FastAPI)</strong></p>
            </div>
            <div class="flex items-center space-x-2">
                <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    🟢 Canlı & Yayında (200 OK)
                </span>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Left: Add Form (4 cols) -->
            <div class="lg:col-span-4 bg-slate-900/90 border border-white/10 rounded-2xl p-5 space-y-4">
                <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                    <span>➕ Yeni Randevu Ekle</span>
                </h2>

                <form id="record-form" class="space-y-3">
                    
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Hasta Adı Soyadı</label>
                    <input type="text" id="field_patient_name" placeholder="Mehmet Demir" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-amber-500" required/>
                </div>
                

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Doktor</label>
                    <input type="text" id="field_doctor_name" placeholder="Dr. Ayşe Yılmaz" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-amber-500" required/>
                </div>
                

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Poliklinik</label>
                    <input type="text" id="field_department" placeholder="Kardiyoloji" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-amber-500" required/>
                </div>
                

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Randevu Tarihi</label>
                    <input type="text" id="field_appointment_date" placeholder="2026-09-28" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-amber-500" required/>
                </div>
                

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Saat</label>
                    <input type="text" id="field_appointment_time" placeholder="14:30" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-amber-500" required/>
                </div>
                

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Durum</label>
                    <input type="text" id="field_status" placeholder="Onaylandı" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-amber-500" required/>
                </div>
                
                    <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs tracking-wide transition shadow-lg shadow-amber-500/20">
                        ✓ Kaydet ve Servise İlet
                    </button>
                </form>
            </div>

            <!-- Right: Records Table (8 cols) -->
            <div class="lg:col-span-8 bg-slate-900/90 border border-white/10 rounded-2xl p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider">
                        📋 Kayıtlı Appointments Listesi
                    </h2>
                    <input type="text" id="search-input" placeholder="Listede ara..." class="text-xs bg-slate-950 border border-white/10 rounded-lg px-3 py-1.5 text-white placeholder-slate-500 focus:outline-none"/>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left border-collapse">
                        <thead>
                            <tr class="border-b border-white/10 bg-slate-950/40">
                                <th class="text-left py-2.5 px-3 uppercase text-[10px] text-slate-400 font-semibold">ID</th><th class="text-left py-2.5 px-3 uppercase text-[10px] text-slate-400 font-semibold">Hasta Adı Soyadı</th><th class="text-left py-2.5 px-3 uppercase text-[10px] text-slate-400 font-semibold">Doktor</th><th class="text-left py-2.5 px-3 uppercase text-[10px] text-slate-400 font-semibold">Poliklinik</th><th class="text-left py-2.5 px-3 uppercase text-[10px] text-slate-400 font-semibold">Randevu Tarihi</th><th class="text-left py-2.5 px-3 uppercase text-[10px] text-slate-400 font-semibold">Saat</th><th class="text-left py-2.5 px-3 uppercase text-[10px] text-slate-400 font-semibold">Durum</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-white/5">
                            <tr><td colspan="10" class="py-6 text-center text-slate-500">Yükleniyor...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById('table-body');
        const recordForm = document.getElementById('record-form');
        const searchInput = document.getElementById('search-input');

        async function fetchRecords(query = '') {
            try {
                const url = query ? `/api/appointments?search=${encodeURIComponent(query)}` : `/api/appointments`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    renderTable(data);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderTable(items) {
            if (!items || items.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="10" class="py-6 text-center text-slate-500">Kayıt bulunamadı.</td></tr>';
                return;
            }
            tableBody.innerHTML = items.map(item => `
                <tr class="hover:bg-white/5 transition">
                    <td>#${item.id}</td><td>${item.patient_name || "-"}</td><td>${item.doctor_name || "-"}</td><td>${item.department || "-"}</td><td>${item.appointment_date || "-"}</td><td>${item.appointment_time || "-"}</td><td>${item.status || "-"}</td>
                </tr>
            `).join('');
        }

        recordForm.onsubmit = async (e) => {
            e.preventDefault();
            const payload = { patient_name: document.getElementById('field_patient_name').value, doctor_name: document.getElementById('field_doctor_name').value, department: document.getElementById('field_department').value, appointment_date: document.getElementById('field_appointment_date').value, appointment_time: document.getElementById('field_appointment_time').value, status: document.getElementById('field_status').value };
            try {
                const res = await fetch('/api/appointments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    recordForm.reset();
                    fetchRecords();
                }
            } catch (err) {
                alert('Kaydedilemedi!');
            }
        };

        searchInput.oninput = (e) => {
            fetchRecords(e.target.value.trim());
        };

        fetchRecords();
    </script>
</body>
</html>
